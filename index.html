
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Surprise 🎂</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <main class="scene" id="scene">

    <div class="stars" id="stars"></div>

    <div class="intro" id="intro">
      <p class="eyebrow">A LITTLE SURPRISE FOR YOU</p>
      <h1>Make a wish ✨</h1>
      <p class="subtitle">Something sweet is waiting...</p>
      <button id="startBtn">Open your surprise 💗</button>
    </div>

    <section class="celebration" id="celebration">

      <p class="top-message">A special day deserves something sweet</p>

      <div class="cake-area">
        <div class="candles">
          <div class="candle"><span class="flame"></span></div>
          <div class="candle"><span class="flame"></span></div>
          <div class="candle"><span class="flame"></span></div>
        </div>

        <div class="cake">
          <div class="top-layer"></div>
          <div class="middle-layer"></div>
          <div class="bottom-layer"></div>
          <div class="cake-plate"></div>
        </div>
      </div>

      <h2 class="birthday-title" id="birthdayTitle">
        Happy Birthday!
      </h2>

      <p class="birthday-message">
        May your day be filled with love, laughter and magic.
      </p>

      <div class="actions">
        <button id="blowBtn">🌬️ Blow candles</button>
        <button id="replayBtn">↻ Replay</button>
      </div>

    </section>

    <div class="confetti" id="confetti"></div>

    <p class="footer">MADE WITH LOVE ♡</p>

  </main>

  <script src="./script.js" defer></script>
</body>
</html>
